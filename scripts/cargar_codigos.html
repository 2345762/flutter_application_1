<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargador de Códigos Válidos - Firebase Firestore</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0A1128;
      color: #E2E8F0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 24px;
      color: #38BDF8;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p.subtitle {
      color: #94A3B8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .info-box {
      background: rgba(56, 189, 248, 0.1);
      border-left: 4px solid #38BDF8;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #0F172A;
      color: #38BDF8;
      font-weight: 600;
      font-family: monospace;
    }
    .codes-container {
      max-height: 260px;
      overflow-y: auto;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 24px;
    }
    .code-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 13px;
      font-family: monospace;
      background: rgba(255,255,255,0.02);
    }
    .code-row:hover {
      background: rgba(255,255,255,0.06);
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .status-pending { background: #334155; color: #94A3B8; }
    .status-success { background: rgba(34, 197, 94, 0.2); color: #4ADE80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .status-exists { background: rgba(234, 179, 8, 0.2); color: #FACC15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .status-error { background: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0284C7;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #0369A1;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      margin-bottom: 20px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #38BDF8;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>
      <span>✈️</span> Cargador de Códigos de Acceso
    </h1>
    <p class="subtitle">Sincronización directa con Cloud Firestore en <span class="badge">appeov-23dbe</span></p>

    <div class="info-box">
      Colección de destino: <strong class="badge">Códigos_válidos</strong><br>
      Total de códigos a registrar: <strong>23 usuarios</strong>.<br>
      Cada documento se creará con: <code>habilitado: true</code>, <code>en_uso: false</code>, <code>dispositivos_activos: []</code>.
    </div>

    <div class="progress-bar-container" id="progressBarContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="codes-container" id="codesList">
      <!-- Se llenará dinámicamente -->
    </div>

    <div class="actions">
      <button id="btnSubir" class="btn-primary" onclick="iniciarCarga()">
        Subir Códigos a Firebase
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // Configuración oficial del proyecto obtenida de firebase_options.dart
    const firebaseConfig = {
      apiKey: "AIzaSyDQhsjI8SLGhl9dO4-nDftBWgPzMCunVlE",
      appId: "1:279329949546:web:70773ea8c7b2703e9a8713",
      messagingSenderId: "279329949546",
      projectId: "appeov-23dbe",
      authDomain: "appeov-23dbe.firebaseapp.com",
      storageBucket: "appeov-23dbe.firebasestorage.app",
      measurementId: "G-FSTKK1NGNQ"
    };

    const codigos = [
      "MARIAVILLAGRA123",
      "JAVIERLOPEZ123",
      "JOSSIRIVERA123",
      "KARINAFRITIS123",
      "ALEXANDERAGUILAR123",
      "PAMELASARNO123",
      "JAVIERAHERMOSILLA123",
      "DIEGOCASTRO123",
      "SEBASTIANHERNANDEZ123",
      "FELIPECHANDIA123",
      "RAPLHMULLER123",
      "DANIELROJAS123",
      "RODRIGOCELPA123",
      "FELIPEOVALLE123",
      "JOSUEPAINEN123",
      "LUISMARTINEZ123",
      "KENNETHCABELLO123",
      "MARCELOSALAS123",
      "PEDROFLANDEZ123",
      "RICHARDPAEZ123",
      "LIZMUÑOZ123",
      "JOSEVEGA123",
      "VICTORALARCON123"
    ];

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (e) {
      console.error("Error al inicializar Firebase:", e);
    }

    const container = document.getElementById("codesList");
    codigos.forEach((cod, idx) => {
      const row = document.createElement("div");
      row.className = "code-row";
      row.id = `row-${cod}`;
      row.innerHTML = `
        <span>${idx + 1}. <strong>${cod}</strong></span>
        <span class="status-badge status-pending" id="status-${cod}">Pendiente</span>
      `;
      container.appendChild(row);
    });

    window.iniciarCarga = async function() {
      const btn = document.getElementById("btnSubir");
      btn.disabled = true;
      btn.textContent = "Cargando códigos...";

      const progressBarContainer = document.getElementById("progressBarContainer");
      const progressBar = document.getElementById("progressBar");
      progressBarContainer.style.display = "block";

      let completados = 0;

      for (let i = 0; i < codigos.length; i++) {
        const codigo = codigos[i];
        const statusEl = document.getElementById(`status-${codigo}`);

        try {
          const docRef = doc(db, "Códigos_válidos", codigo);
          const snap = await getDoc(docRef);

          if (snap.exists()) {
            const data = snap.data();
            statusEl.className = "status-badge status-exists";
            statusEl.textContent = data.en_uso ? "Ya existe (En uso)" : "Ya existe (Disponible)";
          } else {
            await setDoc(docRef, {
              codigo: codigo,
              habilitado: true,
              en_uso: false,
              "quien entro": null,
              dispositivos_activos: [],
              fecha_creacion: serverTimestamp()
            });
            statusEl.className = "status-badge status-success";
            statusEl.textContent = "Añadido con éxito ✓";
          }
        } catch (error) {
          console.error(`Error en ${codigo}:`, error);
          statusEl.className = "status-badge status-error";
          statusEl.textContent = `Error: ${error.code || error.message || 'Denegado'}`;
        }

        completados++;
        progressBar.style.width = `${(completados / codigos.length) * 100}%`;
      }

      btn.textContent = "Proceso Completado";
    };
  </script>
</body>
</html>
